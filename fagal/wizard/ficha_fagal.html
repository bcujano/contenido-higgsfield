<title>Ficha de Fagal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Concepto: ficha de estudio jurídico, papel limpio, filetes finos y dorado de la marca como único acento. Una pregunta por tarea, pensada para el celular. */
:root{
  --bg:#f3f4f6; --paper:#ffffff; --ink:#12161d; --mut:#586070; --line:#d7dbe2;
  --gold:#c9a45a; --goldtxt:#7a5c18; --ongold:#18130a; --soft:#eceef2; --warn:#a33a2a;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1016; --paper:#141a24; --ink:#ecebe6; --mut:#9aa1ae; --line:#283142;
  --gold:#c9a45a; --goldtxt:#e1c88e; --ongold:#18130a; --soft:#1b2330; --warn:#ff8f7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1016; --paper:#141a24; --ink:#ecebe6; --mut:#9aa1ae; --line:#283142;
  --gold:#c9a45a; --goldtxt:#e1c88e; --ongold:#18130a; --soft:#1b2330; --warn:#ff8f7a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{height:40px;width:auto;display:block;color:var(--ink);flex:none}
.brand b{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.22em;line-height:1}
.brand small{display:block;font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.34em;color:var(--mut);margin-top:5px}
.exp{font-size:13px;color:var(--mut);text-align:right;line-height:1.3}
.bar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.bar button{border:0;background:var(--line);height:6px;border-radius:3px;padding:0;cursor:pointer}
.bar button[aria-current="step"]{background:var(--gold)}
.bar button.done{background:var(--goldtxt);opacity:.55}
.stepname{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--goldtxt)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,8vw,40px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
.lead{color:var(--mut);margin:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px}
.q{display:flex;flex-direction:column;gap:8px;min-width:0}
.q>label,.q>.lbl{font-weight:700;font-size:16px}
.hint{font-size:14px;color:var(--mut);font-weight:400}
input[type=text],input[type=time],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 13px;min-height:48px}
textarea{min-height:104px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button,.seg button{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:10px 14px;min-height:44px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ongold)}
.row{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row>span{font-weight:600;font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button[aria-checked="true"]{background:var(--gold);border-color:var(--gold);color:var(--ongold)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:16px;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--gold);flex:none}
.nav{display:flex;gap:12px;justify-content:space-between}
.btn{font:inherit;font-weight:800;font-size:17px;border-radius:10px;padding:14px 22px;min-height:52px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--ongold);flex:1}
.btn.ghost{background:transparent;color:var(--mut);font-weight:600;font-size:15px;min-height:44px}
.pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.5;background:var(--soft);border-radius:8px;padding:14px;max-height:340px;overflow:auto;margin:0;color:var(--ink)}
.miss{margin:0;padding-left:20px;color:var(--warn);font-size:15px}
.ok{color:var(--goldtxt);font-weight:700}
.note{font-size:14px;color:var(--mut)}
.dead{text-align:center;padding:48px 8px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

()=>`<div class="stepname">Paso 1 de 6</div><h1>A qué empresas queremos llegar</h1>

 ${tx("ea","A quién pasa los casos urgentes","escA",{ph:"Nombre y cargo"})}
 ${sel("re","Tiempo máximo en que una persona responde un caso urgente","resp",["5 minutos","15 minutos","1 hora","Mismo día"])}</div>
 <div class="card">${tx("e1","Un gerente escribe: «Quiero saber cómo trabajan con empresas». ¿Cómo le responderían?","ej1",{ta:1})}
 ${tx("e2","Otro escribe: «Me llegó una citación, ¿qué hago?». ¿Cómo le responderían?","ej2",{ta:1})}</div>`,

()=>`<div class="stepname">Paso 5 de 6</div><h1>Permisos y oferta</h1><p class="lead">Sin estas autorizaciones no usamos nada. Marque solo lo que autoriza.</p>
 <div class="card"><div class="q"><span class="lbl">El diagnóstico gratuito de 20 minutos</span>${seg("grat",GRAT_OPT)}</div>
 ${getP("grat")==="cupos"?tx("cu","¿Cuántos cupos al mes?","cupos",{ph:"Ejemplo: 12"}):""}
 ${PERMS.map(([k,l])=>`<label class="chk"><input type="checkbox" data-cb="perm" value="${k}"${S.perm.indexOf(k)>-1?" checked":""}><span>${l}</span></label>`).join("")}</div>
 <div class="card">${tx("fi","Nombre de quien autoriza","firma",{ph:"Nombre completo"})}${tx("fc","Cargo","cargo",{ph:"Ejemplo: Socio fundador"})}</div>`,

()=>{const m=missing();return `<div class="stepname">Paso 6 de 6</div><h1>Revisar y enviar</h1><p class="lead">Copie el texto y péguelo en el WhatsApp de quien le envió este enlace.</p>
 <div class="card">${m.length?`<div class="q"><span class="lbl">Falta por responder</span><ul class="miss">${m.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:`<div class="ok">Todo está respondido.</div>`}
 <pre class="pre" id="out">${esc(buildText())}</pre>
 <button class="btn pri" type="button" data-act="copy" id="copy">Copiar respuestas</button>
 ${PHONE?`<a class="btn" style="text-align:center;text-decoration:none" href="https://wa.me/${PHONE}" target="_blank" rel="noopener">Abrir WhatsApp</a>`:""}
 <div class="note" id="cmsg" aria-live="polite"></div></div>
 <div class="card"><div class="q"><span class="lbl">Fotos del Dr. Galarraga</span><p class="note" style="margin:0">Envíe por WhatsApp, como documento (clip, luego Documento), entre 8 y 12 fotos suyas solo, con la cara bien visible: de frente y de lado, serio y sonriendo, de rostro, medio cuerpo y cuerpo entero, con su look de siempre.</p></div>
 <button class="btn ghost" type="button" data-act="wipe">Borrar mis respuestas de este dispositivo</button></div>`}
];

function missing(){const m=[];
 const n=PERFILES.filter(([k])=>!S.perfil[k]).length;if(n)m.push("Perfiles de empresa sin marcar: "+n);
 if(!S.casos.length)m.push("Qué casos de empresa toma Fagal");
 if(!S.quien.trim())m.push("Quién atiende el diagnóstico");
 if(!S.dias.length)m.push("Días disponibles");
 if(!S.datos.length)m.push("Datos que toma el asistente antes de agendar");
 if(!S.escA.trim())m.push("A quién pasan los casos urgentes");
 if(!S.grat)m.push("Condición del diagnóstico gratuito");
 if(S.perm.indexOf("bra")<0)m.push("Autorización al brazo comercial con IA");
 if(!S.firma.trim())m.push("Nombre de quien autoriza");
 return m}

function buildText(){const L=[];const a=t=>L.push(t);
 a("FICHA FAGAL: BRAZO COMERCIAL IA B2B");a("Fecha: "+new Date().toLocaleDateString("es-EC"));
 a("\n1. CLIENTES");PERFILES.forEach(([k,l])=>a("- "+l+": "+(PERFIL_LBL[S.perfil[k]]||"sin responder")));
 a("Casos que toma: "+(S.casos.join(", ")||"sin responder"));a("No toma o deriva: "+(S.noCasos||"-"));a("Tamaño preferido: "+(S.tam.join(", ")||"-"));a("Ciudades: "+(S.ciudades||"-"));a("Buen prospecto si: "+(S.senales.join(", ")||"-"));
 a("\n2. CONVENIOS Y ACCESO");GRUPOS.forEach(g=>{if(S.conv[g])a("- "+g+": "+GRUPO_LBL[S.conv[g]])});
 a("Frase de acceso: "+(S.convFrase||"-"));a("Nunca afirmar: "+(S.noAfirmar||"-"));a("Medio de las entrevistas: "+(S.medio||"-"));a("Enlaces:\n"+(S.videos||"-"));
 a("\n3. REUNIÓN DE DIAGNÓSTICO");a("Atiende: "+(S.quien||"-")+" ("+S.dur+" min)");a("Días: "+(S.dias.join(", ")||"-")+" de "+S.desde+" a "+S.hasta);
 a("Modalidad: "+(S.mod.join(", ")||"-"));a("Zonas: "+(S.zonas||"-"));a("Capacidad por semana: "+S.cap);a("Se revisa: "+(S.revisa.join(", ")||"-"));a("Se lleva la empresa: "+(S.entrega||"-"));a("Datos antes de agendar: "+(S.datos.join(", ")||"-"));
 a("\n4. VOZ DEL ASISTENTE");a("Trato: "+S.trato);a("Tono: "+(S.tono.join(", ")||"-"));a("Palabras que sí: "+(S.palSi||"-"));a("Palabras que evitan: "+(S.palNo||"-"));a("Nunca: "+(S.nunca.join(", ")||"-"));
 a("Si preguntan el precio: "+PRECIO_LBL[S.precio]);a("Pasa a una persona si menciona: "+(S.esc.join(", ")||"-"));a("Urgencias a: "+(S.escA||"-")+" (responde en "+S.resp+")");
 a("Respuesta a «cómo trabajan con empresas»:\n"+(S.ej1||"-"));a("Respuesta a «me llegó una citación»:\n"+(S.ej2||"-"));
 a("\n5. PERMISOS");a("Diagnóstico gratuito: "+(GRAT_LBL[S.grat]||"sin responder")+(S.grat==="cupos"?" ("+(S.cupos||"?")+" al mes)":""));
 PERMS.forEach(([k,l])=>a((S.perm.indexOf(k)>-1?"[x] ":"[ ] ")+l));
 a("Autoriza: "+(S.firma||"-")+(S.cargo?", "+S.cargo:""));return L.join("\n")}

function render(){
 const app=document.getElementById("app");app.innerHTML=views[S.step]()+`<div class="nav">${S.step>0?`<button class="btn" type="button" data-act="prev">Atrás</button>`:""}${S.step<5?`<button class="btn pri" type="button" data-act="next">${S.step===4?"Revisar":"Siguiente"}</button>`:""}</div>`;
 document.getElementById("bar").innerHTML=STEPS.map((n,i)=>`<button type="button" data-go="${i}" aria-label="${n}" ${i===S.step?'aria-current="step"':""} class="${i<S.step?"done":""}"></button>`).join("");
 save()}
function go(i){S.step=Math.max(0,Math.min(5,i));render();window.scrollTo({top:0,behavior:"smooth"})}

document.addEventListener("click",e=>{
 const t=e.target.closest("[data-set],[data-toggle],[data-act],[data-go]");if(!t)return;
 if(t.dataset.set){setP(t.dataset.set,t.dataset.v);t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-checked",b===t?"true":"false"));save();if(t.dataset.set==="grat")render();return}
 if(t.dataset.toggle){const p=t.dataset.toggle,arr=(getP(p)||[]).slice(),i=arr.indexOf(t.dataset.v);if(i>-1)arr.splice(i,1);else arr.push(t.dataset.v);setP(p,arr);t.setAttribute("aria-pressed",i>-1?"false":"true");save();return}
 if(t.dataset.go!=null){go(+t.dataset.go);return}
 const a=t.dataset.act;
 if(a==="next")go(S.step+1);else if(a==="prev")go(S.step-1);
 else if(a==="copy"){const txt=buildText(),msg=document.getElementById("cmsg");
  const fb=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("out"));const s=getSelection();s.removeAllRanges();s.addRange(r);msg.textContent="Texto seleccionado. Cópielo manualmente y péguelo en WhatsApp."};
  try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent="Copiado. Péguelo en WhatsApp."},fb)}catch(x){fb()}}
 else if(a==="wipe"){S=defaults();try{localStorage.removeItem(KEY)}catch(x){}render()}
});
document.addEventListener("input",e=>{const t=e.target.closest("[data-bind]");if(t){setP(t.dataset.bind,t.value);save()}});
document.addEventListener("change",e=>{const c=e.target.closest("[data-cb]");if(c){const p=c.dataset.cb,arr=(getP(p)||[]).slice(),i=arr.indexOf(c.value);if(c.checked&&i<0)arr.push(c.value);if(!c.checked&&i>-1)arr.splice(i,1);setP(p,arr);save()}});

(function init(){
 const exp=document.getElementById("exp");
 if(new Date()>EXPIRES){document.getElementById("bar").hidden=true;document.getElementById("app").innerHTML='<div class="card dead"><h1>Este enlace caducó</h1><p class="lead">Pida uno nuevo a quien se lo envió.</p></div>';exp.textContent="";return}
 exp.innerHTML="Dura hasta el<br>14 de octubre";render()})();

</script>
